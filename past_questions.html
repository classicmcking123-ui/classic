<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive - Past Questions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff416c">
    <script src="js/register-sw.js"></script>
    <style>
        /* This page uses a solid, non-sticky navbar */
        nav { background: #111; backdrop-filter: none; -webkit-backdrop-filter: none; padding: 20px 40px; border-bottom: none; position: static; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
        .logo { font-weight: bold; letter-spacing: normal; }
        .nav-links a { color: #fff; font-weight: normal; transition: color 0.3s; }
        .light-mode nav { background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        @media (max-width: 480px) {
            nav { padding: 14px 18px; }
        }

        .container { flex: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }

        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background-color: #222; border: 1px dashed #444; border-radius: 12px; padding: 60px 30px; }
        .empty-state i { font-size: 48px; color: #ff416c; margin-bottom: 20px; }
        .empty-state h2 { font-size: 20px; margin-bottom: 10px; }
        .empty-state p { color: #aaa; font-size: 14px; max-width: 400px; line-height: 1.6; }
        .light-mode .empty-state { background-color: #fff; border-color: #e0e0e0; }
        .light-mode .empty-state h2 { color: #222; }
        .light-mode .empty-state p { color: #666; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Past Questions</h1>
                <p><i class="fas fa-file-alt"></i> Practice with previous examination papers.</p>
            </div>
            <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dash</a>
        </div>

        <div class="empty-state">
            <i class="fas fa-tools"></i>
            <h2>Coming Soon</h2>
            <p>We're building out the Past Questions archive. Check back soon, or explore Course Outlines and Notes in the meantime.</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
