<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive - Offline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle at 20% 0%, #23232d 0%, #16161a 45%, #101012 100%);
            color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            text-align: center; max-width: 420px; background: linear-gradient(165deg, #202027, #1a1a1f);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .icon { font-size: 44px; color: #ff416c; margin-bottom: 18px; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .links a {
            background: linear-gradient(135deg, #ff4b2b, #ff416c); color: #fff; text-decoration: none;
            padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 700;
        }
        button {
            background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #ccc;
            padding: 10px 20px; border-radius: 20px; font-size: 13px; cursor: pointer;
        }
        button:hover { border-color: #25D366; color: #25D366; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-wifi icon"></i>
        <h1>You're offline</h1>
        <p>This page hasn't been saved for offline viewing yet. Pages you've already visited - like your Course Outlines or Notes - are still available.</p>
        <div class="links">
            <a href="course_outlines.html">Course Outlines</a>
            <a href="notes.html">Notes &amp; Tips</a>
        </div>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
