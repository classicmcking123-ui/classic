<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Create Account</title>
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff416c">
    <!-- Firebase (Auth + Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="register-sw.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('download.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 768px;
            max-width: 100%;
            height: 540px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25),
                        0 10px 10px rgba(0, 0, 0, 0.22);
            overflow: hidden;
            animation: containerIn 0.5s ease backwards;
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: #ff416c;
            background: linear-gradient(to right, #ff4b2b, #ff416c);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: #fff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        form {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        h1 {
            font-weight: bold;
            margin-bottom: 15px;
            color: #222;
        }

        span {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

       input, select {
            background-color: #eee;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 65, 108, 0.2);
        }

        .forgot-pass {
            color: #666;
            font-size: 13px;
            text-decoration: none;
            margin: 10px 0 15px 0;
            display: block;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        .mobile-auth-switch {
            display: none; /* Only shown on mobile, see media query below - desktop uses the overlay panel instead */
            color: #ff416c;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            margin-top: 15px;
        }
        /* Password Eye Icon Styles */
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            width: 100%; /* Ensures the input still takes full width */
        }

        .password-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .password-container i:hover {
            color: #ff416c;
        }

        /* --- Validation Styles --- */
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .input-wrapper input {
            width: 100%;
        }
        .validation-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: none; /* Hidden by default */
        }
        /* Green Checkmark */
        .validation-icon.valid {
            display: block;
            color: #25D366; 
        }
        /* Red Highlight for Errors */
        input.invalid {
            border: 2px solid #ff4b2b !important;
            background-color: #ffe6e6;
        }

        button {
            border-radius: 20px;
            border: 1px solid #ff4b2b;
            background-color: #ff4b2b;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease;
            cursor: pointer;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus {
            outline: none;
        }

        button.ghost {
            background-color: transparent;
            border-color: #fff;
        }

        p {
            font-size: 14px;
            font-weight: 100;
            line-height: 20px;
            letter-spacing: 0.5px;
            margin: 20px 0 30px;
        }

        /* --- Mobile: the sliding two-panel layout doesn't fit a narrow screen, so it's
           replaced with a single stacked form and a plain text link to switch modes --- */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 30px 0;
            }
            .container {
                width: calc(100% - 32px);
                max-width: 420px;
                height: auto;
                margin: 0 16px;
            }
            .overlay-container {
                display: none;
            }
            .form-container {
                position: static;
                width: 100%;
                height: auto;
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
                z-index: 1 !important;
            }
            .sign-up-container { display: none; }
            .container.right-panel-active .sign-up-container { display: block; }
            .container.right-panel-active .sign-in-container { display: none; }
            form {
                padding: 40px 30px;
            }
            .mobile-auth-switch {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Sign Up Form -->
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h1>Create Account</h1>
                <span>Register with E-mail</span>
                
                <!-- Phone Input with Validation Icon -->
                <div class="input-wrapper">
                    <input type="tel" id="signupPhone" placeholder="Phone No. (e.g. 080...)" autocomplete="tel" required />
                    <i class="fas fa-check-circle validation-icon" id="phoneIcon"></i>
                </div>
                
                <input type="text" id="signupName" placeholder="Name" autocomplete="name" required />

                <!-- Username Input with Validation Icon -->
                <div class="input-wrapper">
                    <input type="text" id="signupUsername" placeholder="Choose a username" autocomplete="off" required />
                    <i class="fas fa-check-circle validation-icon" id="usernameIcon"></i>
                </div>
                <small id="usernameStatus" style="display: block; text-align: left; margin: -8px 0 8px; font-size: 11px; min-height: 14px;"></small>

                <!-- Email Input with Validation Icon -->
                <div class="input-wrapper">
                    <input type="email" id="signupEmail" placeholder="Enter E-mail" autocomplete="email" required />
                    <i class="fas fa-check-circle validation-icon" id="emailIcon"></i>
                </div>

                <select id="signupCourse" required>
                    <option value="" disabled selected>Select your engineering course</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Agricultural Engineering">Agricultural Engineering</option>
                </select>

                <div class="password-container">
                    <input type="password" id="signupPassword" placeholder="Enter Password" autocomplete="new-password" required />
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                
                <div class="password-container">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" autocomplete="new-password" required />
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <button type="submit">Sign Up</button>
                <a href="#" class="mobile-auth-switch" id="switchToSignIn">Already have an account? Sign In</a>
            </form>
        </div>

        <!-- Sign In Form -->
        <div class="form-container sign-in-container">
            <form id="signinForm">
                <h1>Sign In</h1>
                <span>Sign in With Email & Password</span>
                <input type="email" id="signinEmail" placeholder="Enter E-mail" autocomplete="email" required />

                <div class="password-container">
                    <input type="password" id="signinPassword" placeholder="Enter Password" autocomplete="current-password" required />
                    <i class="fas fa-eye toggle-password"></i>
                </div>

                <a href="#" class="forgot-pass">Forget Password?</a>
                <button type="submit">Sign In</button>
                <a href="#" class="mobile-auth-switch" id="switchToSignUp">Don't have an account? Sign Up</a>
            </form>
        </div>

        <!-- Overlay Container -->
        <div class="overlay-container">
            <div class="overlay">
                <!-- Overlay Left (Shown when Sign Up is active) -->
                <div class="overlay-panel overlay-left">
                    <h1>Welcome To StudyHive<i class="fab fa-hive"></i></h1>
                    <p><b>Sign in With Email & Password</b></p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <!-- Overlay Right (Shown when Sign In is active) -->
                <div class="overlay-panel overlay-right">
                    <h1>Hello World</h1>
                    <p><b>Today And Start Asking, Learning, And Mastering Your Courses</b></p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        // Let the user know why they landed here if idle-timeout.js just signed them out
        if (new URLSearchParams(window.location.search).get('timeout') === '1') {
            alert("You were signed out after 30 minutes of inactivity. Please sign in again.");
        }

        // This array will act as our temporary database for now
        const registeredUsers = [];

        signUpButton.addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        signInButton.addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });

        // Mobile-only text links that do the same thing as the desktop overlay buttons
        // (that overlay panel is hidden on small screens, see the mobile media query below)
        document.getElementById('switchToSignUp').addEventListener('click', (e) => {
            e.preventDefault();
            container.classList.add("right-panel-active");
        });
        document.getElementById('switchToSignIn').addEventListener('click', (e) => {
            e.preventDefault();
            container.classList.remove("right-panel-active");
        });

        // --- NEW: Toggle Password Visibility ---
        const togglePasswordIcons = document.querySelectorAll('.toggle-password');
        togglePasswordIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });

        const signinForm = document.getElementById('signinForm');
        const signupForm = document.getElementById('signupForm');

        // --- LIVE FORM VALIDATION ---
        const phoneInput = document.getElementById('signupPhone');
        const phoneIcon = document.getElementById('phoneIcon');
        const emailInput = document.getElementById('signupEmail');
        const emailIcon = document.getElementById('emailIcon');
        const usernameInput = document.getElementById('signupUsername');
        const usernameIcon = document.getElementById('usernameIcon');
        const usernameStatus = document.getElementById('usernameStatus');

        const USERNAME_REGEX = /^[a-zA-Z0-9_]{3,20}$/;
        let usernameAvailable = false;
        let usernameCheckToken = 0;
        let usernameDebounce = null;

        // 0. Username Validation + Live Availability Check
        usernameInput.addEventListener('input', function() {
            usernameAvailable = false;
            usernameIcon.classList.remove('valid');
            this.classList.remove('invalid');
            clearTimeout(usernameDebounce);

            const value = this.value.trim();
            if (value.length === 0) {
                usernameStatus.textContent = '';
                return;
            }

            if (!USERNAME_REGEX.test(value)) {
                this.classList.add('invalid');
                usernameStatus.textContent = '3-20 characters: letters, numbers, underscores only';
                usernameStatus.style.color = '#ff4b2b';
                return;
            }

            usernameStatus.textContent = 'Checking availability...';
            usernameStatus.style.color = '#888';

            const myToken = ++usernameCheckToken;
            usernameDebounce = setTimeout(async () => {
                const taken = await db.collection('usernames').doc(value.toLowerCase()).get();
                if (myToken !== usernameCheckToken) return; // a newer keystroke already superseded this check

                if (taken.exists) {
                    usernameInput.classList.add('invalid');
                    usernameStatus.textContent = 'Username is already taken';
                    usernameStatus.style.color = '#ff4b2b';
                } else {
                    usernameAvailable = true;
                    usernameIcon.classList.add('valid');
                    usernameStatus.textContent = 'Username is available';
                    usernameStatus.style.color = '#25D366';
                }
            }, 400);
        });

        // 1. Email Validation
        emailInput.addEventListener('input', function() {
            // Checks for a standard email pattern (e.g., name@domain.com)
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; 
            
            if (emailRegex.test(this.value)) {
                this.classList.remove('invalid');
                emailIcon.classList.add('valid'); // Show green check
            } else {
                emailIcon.classList.remove('valid'); // Hide check
                // Only highlight red if they've actually typed something
                if (this.value.length > 0) this.classList.add('invalid');
                else this.classList.remove('invalid');
            }
        });

        // 2. Nigerian Phone Validation
        phoneInput.addEventListener('input', function() {
            // Checks for Nigerian format: 11 digits starting with 0 (e.g., 080, 091) OR starting with +234
            const phoneRegex = /^(0[789][01]\d{8}|\+234[789][01]\d{8})$/;
            
            if (phoneRegex.test(this.value)) {
                this.classList.remove('invalid');
                phoneIcon.classList.add('valid'); // Show green check
            } else {
                phoneIcon.classList.remove('valid'); // Hide check
                if (this.value.length > 0) this.classList.add('invalid');
                else this.classList.remove('invalid');
            }
        });

       // --- Handle Sign Up (Sends data to backend server) ---
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('signupPhone').value;
            const name = document.getElementById('signupName').value;
            const username = usernameInput.value.trim();
            const usernameLower = username.toLowerCase();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const course = document.getElementById('signupCourse').value;

            // 1. Check if passwords match before sending to server
            if (password !== confirmPassword) {
                alert("Your passwords do not match. Please try again!");
                return; // Stops the code here so it doesn't send bad data
            }

            if (!USERNAME_REGEX.test(username)) {
                alert("Please choose a username (3-20 characters: letters, numbers, underscores only).");
                return;
            }

            // 2. Re-check availability right before submitting (the live check may be stale/still running)
            try {
                const taken = await db.collection('usernames').doc(usernameLower).get();
                if (taken.exists) {
                    usernameInput.classList.add('invalid');
                    usernameStatus.textContent = 'Username is already taken';
                    usernameStatus.style.color = '#ff4b2b';
                    alert("That username was just taken, please choose another.");
                    return;
                }
            } catch (error) {
                alert('Could not verify username availability. ' + error.message);
                return;
            }

            // 3. Create the account in Firebase Auth, then atomically claim the username + save the profile
            try {
                const credential = await auth.createUserWithEmailAndPassword(email, password);
                let finalUsername = username;

                try {
                    await db.runTransaction(async (tx) => {
                        const usernameRef = db.collection('usernames').doc(usernameLower);
                        const usernameDoc = await tx.get(usernameRef);
                        if (usernameDoc.exists) {
                            // Extremely rare race: someone else claimed it between our check and now.
                            // Fall back to a unique variant instead of leaving the account with no profile.
                            finalUsername = username + '_' + credential.user.uid.slice(0, 4);
                        }
                        tx.set(db.collection('usernames').doc(finalUsername.toLowerCase()), { uid: credential.user.uid });
                        tx.set(db.collection('users').doc(credential.user.uid), {
                            name, phone, email, course, profileImage: '',
                            name_lower: name.toLowerCase(),
                            username: finalUsername,
                            username_lower: finalUsername.toLowerCase(),
                            xp: 0
                        });
                    });
                } catch (txError) {
                    console.error('Username claim failed', txError);
                }

                alert(finalUsername === username
                    ? 'Account created successfully!'
                    : `Account created! Your username was taken at the last moment, so we set it to "${finalUsername}" instead — you can change it anytime in Settings.`);
                container.classList.remove("right-panel-active");
                signupForm.reset();
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    alert("This email is already registered! Please sign in instead.");
                    container.classList.remove("right-panel-active");
                } else if (error.code === 'auth/weak-password') {
                    alert("Password is too weak. Please use at least 6 characters.");
                } else {
                    alert(error.message);
                }
            }
        });

        // --- Handle Sign In (Checks credentials with backend server) ---
        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            try {
                const credential = await auth.signInWithEmailAndPassword(email, password);
                const profileDoc = await db.collection('users').doc(credential.user.uid).get();
                const profile = profileDoc.exists ? profileDoc.data() : {};

                // Save the user data to localStorage so home.html and profile.html can use it
                localStorage.setItem('studyHiveUser', JSON.stringify({
                    id: credential.user.uid,
                    name: profile.name || '',
                    phone: profile.phone || '',
                    email: credential.user.email,
                    course: profile.course || '',
                    profileImage: profile.profileImage || '',
                    username: profile.username || ''
                }));
                window.location.href = 'home.html';
            } catch (error) {
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    alert("Incorrect email or password!");
                } else {
                    alert(error.message);
                }
            }
        });
    </script>

</body>
</html>
