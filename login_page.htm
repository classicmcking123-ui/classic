<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff416c">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/register-sw.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: url('images/login-background.jpg') center / cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container {
            position: relative;
            width: 768px;
            max-width: 100%;
            height: 540px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25), 0 10px 10px rgba(0, 0, 0, 0.22);
            overflow: hidden;
            animation: containerIn 0.5s ease backwards;
        }

        /* Desktop: the two forms sit side by side and a coloured overlay slides across to
           reveal one or the other (.right-panel-active = sign-up showing). */
        .form-container { position: absolute; top: 0; height: 100%; left: 0; width: 50%; transition: all 0.6s ease-in-out; }
        .sign-in-container { z-index: 2; }
        .sign-up-container { opacity: 0; z-index: 1; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); }
        .container.right-panel-active .sign-up-container { transform: translateX(100%); opacity: 1; z-index: 5; animation: show 0.6s; }

        @keyframes show {
            0%, 49% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .overlay-container { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100; }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: linear-gradient(to right, #ff4b2b, #ff416c);
            color: #fff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transition: transform 0.6s ease-in-out;
        }
        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transition: transform 0.6s ease-in-out;
        }
        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        form {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
        }

        h1 { font-weight: bold; margin-bottom: 15px; color: #222; }
        span { font-size: 12px; color: #666; margin-bottom: 10px; }

        p { font-size: 14px; font-weight: 100; line-height: 20px; letter-spacing: 0.5px; margin: 20px 0 30px; }

        input, select {
            background-color: #eee;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 5px;
            font-size: 14px;
            color: #333;
        }
        input:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(255, 65, 108, 0.2); }
        input.invalid { border: 2px solid #ff4b2b !important; background-color: #ffe6e6; }

        .forgot-pass { color: #666; font-size: 13px; text-decoration: none; margin: 10px 0 15px 0; display: block; }
        .forgot-pass:hover { text-decoration: underline; }

        /* Replaces the overlay buttons on small screens (see the media query below) */
        .mobile-auth-switch { display: none; color: #ff416c; font-size: 13px; font-weight: bold; text-decoration: none; margin-top: 15px; }

        /* Inputs with an icon on the right: show/hide password, or a green "valid" check */
        .password-container, .input-wrapper { position: relative; width: 100%; }
        .password-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }
        .password-container i:hover { color: #ff416c; }
        .validation-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); display: none; }
        .validation-icon.valid { display: block; color: #25D366; }

        #usernameStatus { display: block; text-align: left; margin: -8px 0 8px; font-size: 11px; min-height: 14px; }

        button {
            border-radius: 20px;
            border: 1px solid #ff4b2b;
            background-color: #ff4b2b;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { transform: scale(0.95); }
        button:focus { outline: none; }
        button.ghost { background-color: transparent; border-color: #fff; }

        /* Mobile: the sliding two-panel layout doesn't fit, so show one stacked form at a time */
        @media (max-width: 768px) {
            body { align-items: flex-start; padding: 30px 0; }
            .container { width: calc(100% - 32px); max-width: 420px; height: auto; margin: 0 16px; }
            .overlay-container { display: none; }
            .form-container {
                position: static;
                width: 100%;
                height: auto;
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
                z-index: 1 !important;
            }
            .sign-up-container { display: none; }
            .container.right-panel-active .sign-up-container { display: block; }
            .container.right-panel-active .sign-in-container { display: none; }
            form { padding: 40px 30px; }
            .mobile-auth-switch { display: block; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up-container">
            <form id="signupForm">
                <h1>Create Account</h1>
                <span>Register with E-mail</span>

                <div class="input-wrapper">
                    <input type="tel" id="signupPhone" placeholder="Phone No. (e.g. 080...)" autocomplete="tel" required />
                    <i class="fas fa-check-circle validation-icon" id="phoneIcon"></i>
                </div>

                <input type="text" id="signupName" placeholder="Name" autocomplete="name" required />

                <div class="input-wrapper">
                    <input type="text" id="signupUsername" placeholder="Choose a username" autocomplete="off" required />
                    <i class="fas fa-check-circle validation-icon" id="usernameIcon"></i>
                </div>
                <small id="usernameStatus"></small>

                <div class="input-wrapper">
                    <input type="email" id="signupEmail" placeholder="Enter E-mail" autocomplete="email" required />
                    <i class="fas fa-check-circle validation-icon" id="emailIcon"></i>
                </div>

                <select id="signupCourse" required>
                    <option value="" disabled selected>Select your engineering course</option>
                </select>

                <div class="password-container">
                    <input type="password" id="signupPassword" placeholder="Enter Password" autocomplete="new-password" required />
                    <i class="fas fa-eye toggle-password"></i>
                </div>

                <div class="password-container">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" autocomplete="new-password" required />
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <button type="submit">Sign Up</button>
                <a href="#" class="mobile-auth-switch" id="switchToSignIn">Already have an account? Sign In</a>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form id="signinForm">
                <h1>Sign In</h1>
                <span>Sign in With Email & Password</span>
                <input type="email" id="signinEmail" placeholder="Enter E-mail" autocomplete="email" required />

                <div class="password-container">
                    <input type="password" id="signinPassword" placeholder="Enter Password" autocomplete="current-password" required />
                    <i class="fas fa-eye toggle-password"></i>
                </div>

                <a href="#" class="forgot-pass">Forget Password?</a>
                <button type="submit">Sign In</button>
                <a href="#" class="mobile-auth-switch" id="switchToSignUp">Don't have an account? Sign Up</a>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome To StudyHive<i class="fab fa-hive"></i></h1>
                    <p><b>Sign in With Email & Password</b></p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello World</h1>
                    <p><b>Today And Start Asking, Learning, And Mastering Your Courses</b></p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/username.js"></script>
    <script>
        const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        // Nigerian mobile numbers: 11 digits starting 070/080/081/090/091..., or the +234 form
        const PHONE_PATTERN = /^(0[789][01]\d{8}|\+234[789][01]\d{8})$/;
        const INVALID_LOGIN_CODES = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'];

        const container = document.getElementById('container');
        const signupForm = document.getElementById('signupForm');
        const signinForm = document.getElementById('signinForm');
        const usernameInput = document.getElementById('signupUsername');
        const usernameIcon = document.getElementById('usernameIcon');

        const showSignUp = () => container.classList.add('right-panel-active');
        const showSignIn = () => container.classList.remove('right-panel-active');
        const fieldValue = (id) => document.getElementById(id).value;

        if (new URLSearchParams(window.location.search).get('timeout') === '1') {
            alert('You were signed out after 30 minutes of inactivity. Please sign in again.');
        }

        document.getElementById('signUp').addEventListener('click', showSignUp);
        document.getElementById('signIn').addEventListener('click', showSignIn);
        document.getElementById('switchToSignUp').addEventListener('click', (event) => {
            event.preventDefault();
            showSignUp();
        });
        document.getElementById('switchToSignIn').addEventListener('click', (event) => {
            event.preventDefault();
            showSignIn();
        });

        document.querySelectorAll('.toggle-password').forEach((icon) => {
            icon.addEventListener('click', () => {
                const input = icon.previousElementSibling;
                const reveal = input.type === 'password';
                input.type = reveal ? 'text' : 'password';
                icon.classList.toggle('fa-eye', !reveal);
                icon.classList.toggle('fa-eye-slash', reveal);
            });
        });

        addSelectOptions(document.getElementById('signupCourse'), DEPARTMENTS);

        // Green check once the value matches; red outline only after something has been typed.
        function validateAsYouType(input, icon, pattern) {
            input.addEventListener('input', () => {
                const valid = pattern.test(input.value);
                icon.classList.toggle('valid', valid);
                input.classList.toggle('invalid', !valid && input.value.length > 0);
            });
        }

        validateAsYouType(document.getElementById('signupEmail'), document.getElementById('emailIcon'), EMAIL_PATTERN);
        validateAsYouType(document.getElementById('signupPhone'), document.getElementById('phoneIcon'), PHONE_PATTERN);

        const usernameCheck = watchUsernameAvailability(usernameInput, document.getElementById('usernameStatus'), {
            onChange: (state) => {
                usernameInput.classList.toggle('invalid', state === 'invalid' || state === 'taken');
                usernameIcon.classList.toggle('valid', state === 'available');
            }
        });

        function resetSignupForm() {
            signupForm.reset();
            usernameCheck.clear();
            signupForm.querySelectorAll('.validation-icon').forEach((icon) => icon.classList.remove('valid'));
            signupForm.querySelectorAll('input.invalid').forEach((input) => input.classList.remove('invalid'));
        }

        // Claims the username and writes the profile in one transaction. If someone grabbed the
        // username since the availability check, fall back to a unique variant instead of failing.
        async function createProfile(uid, { name, phone, email, course, username }) {
            let finalUsername = username;
            await db.runTransaction(async (tx) => {
                const requested = await tx.get(db.collection('usernames').doc(username.toLowerCase()));
                finalUsername = requested.exists ? `${username}_${uid.slice(0, 4)}` : username;

                tx.set(db.collection('usernames').doc(finalUsername.toLowerCase()), { uid });
                tx.set(db.collection('users').doc(uid), {
                    name, phone, email, course,
                    profileImage: '',
                    name_lower: name.toLowerCase(),
                    username: finalUsername,
                    username_lower: finalUsername.toLowerCase(),
                    xp: 0
                });
            });
            return finalUsername;
        }

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const email = fieldValue('signupEmail');
            const password = fieldValue('signupPassword');

            if (password !== fieldValue('signupConfirmPassword')) {
                return alert('Your passwords do not match. Please try again!');
            }
            if (!USERNAME_PATTERN.test(username)) {
                return alert(`Please choose a username (${USERNAME_RULES}).`);
            }

            // The live check may be stale, so check again right before creating the account
            try {
                if (await isUsernameTaken(username)) {
                    usernameCheck.showTaken();
                    return alert('That username was just taken, please choose another.');
                }
            } catch (error) {
                return alert('Could not verify username availability. ' + error.message);
            }

            let credential;
            try {
                credential = await auth.createUserWithEmailAndPassword(email, password);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    alert('This email is already registered! Please sign in instead.');
                    showSignIn();
                } else if (error.code === 'auth/weak-password') {
                    alert('Password is too weak. Please use at least 6 characters.');
                } else {
                    alert(error.message);
                }
                return;
            }

            try {
                const finalUsername = await createProfile(credential.user.uid, {
                    name: fieldValue('signupName'),
                    phone: fieldValue('signupPhone'),
                    course: fieldValue('signupCourse'),
                    email,
                    username
                });
                alert(finalUsername === username
                    ? 'Account created successfully!'
                    : `Account created! Your username was taken at the last moment, so we set it to "${finalUsername}" instead — you can change it anytime in Settings.`);
            } catch (error) {
                console.error('Profile setup failed', error);
                alert('Your account was created, but we could not save your profile details. Please sign in and complete them on your Profile page.');
            }

            showSignIn();
            resetSignupForm();
        });

        signinForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            try {
                const credential = await auth.signInWithEmailAndPassword(fieldValue('signinEmail'), fieldValue('signinPassword'));
                const profileDoc = await db.collection('users').doc(credential.user.uid).get();
                const profile = profileDoc.exists ? profileDoc.data() : {};

                // Every other page reads the signed-in user from here
                localStorage.setItem('studyHiveUser', JSON.stringify({
                    id: credential.user.uid,
                    name: profile.name || '',
                    phone: profile.phone || '',
                    email: credential.user.email,
                    course: profile.course || '',
                    profileImage: profile.profileImage || '',
                    username: profile.username || ''
                }));
                window.location.href = 'home.html';
            } catch (error) {
                alert(INVALID_LOGIN_CODES.includes(error.code) ? 'Incorrect email or password!' : error.message);
            }
        });
    </script>
</body>
</html>
