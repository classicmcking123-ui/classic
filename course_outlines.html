<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive - Course Outlines</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff416c">
    <script src="js/register-sw.js"></script>
    <style>
        .container { flex: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .course-card { background-color: #222; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; overflow: hidden; transition: 0.3s; animation: cardIn 0.4s ease backwards; }
        .course-card:hover { border-color: #444; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }

        .course-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .course-header:hover { background-color: #2a2a2a; }
        .course-header h3 { font-size: 16px; font-weight: 600; }
        .unit-badge { background: rgba(255, 65, 108, 0.1); color: #ff416c; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; border: 1px solid rgba(255, 65, 108, 0.3); }
        .chevron { transition: transform 0.3s ease; color: #888; }
        .course-card.active .chevron { transform: rotate(180deg); color: #ff416c; }

        /* Collapsed by default; toggleCourse() sets max-height to the content height to animate open */
        .course-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .course-content-inner { padding: 20px; border-top: 1px solid #333; }
        .course-content ul { list-style: none; padding-left: 10px; }
        .course-content ul li { position: relative; padding-left: 20px; margin-bottom: 12px; font-size: 14px; color: #ddd; line-height: 1.5; }
        .course-content ul li::before { content: "•"; position: absolute; left: 0; color: #ff4b2b; font-size: 20px; line-height: 1; top: -2px; }

        .light-mode .course-card { background-color: #fff; border-color: #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .light-mode .course-header:hover { background-color: #fafafa; }
        .light-mode .course-header h3 { color: #222; }
        .light-mode .course-content ul li { color: #555; }
        .light-mode .course-content ul li::before { color: #ff416c; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Course Outlines</h1>
                <p><i class="fas fa-calendar-alt"></i> 200 Level — Harmattan Semester (Electrical Engineering)</p>
            </div>
            <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dash</a>
        </div>

        <div id="courseList"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const COURSES = [
            {
                code: 'ENT211', title: 'Entrepreneurship and Innovation', units: 2,
                topics: [
                    'Meaning and concepts of entrepreneurship',
                    'Theories of entrepreneurship',
                    'Characteristics and qualities of an entrepreneur',
                    'Entrepreneurial opportunities and opportunity recognition',
                    'Entrepreneurial/creative thinking',
                    'Innovation and its dimensions',
                    'Business ownership and enterprise formation',
                    'Business planning and networking',
                    'Entrepreneurship in Nigeria and e-commerce'
                ]
            },
            {
                code: 'GET201', title: 'Applied Electricity I', units: 3,
                topics: [
                    'Basic electrical quantities and units',
                    'Electrical circuit components',
                    "Ohm's Law",
                    'Series and parallel circuits',
                    "Kirchhoff's Current and Voltage Laws",
                    'Network/circuit analysis',
                    'Capacitors and inductors',
                    'Electrical measuring instruments',
                    'Magnetic circuits and electromagnetic principles'
                ]
            },
            {
                code: 'GET203', title: 'Engineering Graphics and Solid Modeling II', units: 2,
                topics: [
                    'Orthographic projection',
                    'Isometric and oblique drawings',
                    'Sectional views',
                    'Auxiliary views',
                    'Dimensioning and tolerances',
                    'Intersections and developments',
                    'Assembly drawings',
                    '3D solid modelling',
                    'CAD principles and applications'
                ]
            },
            {
                code: 'GET205', title: 'Fundamentals of Fluid Mechanics', units: 3,
                topics: [
                    'Properties of fluids',
                    'Fluid pressure and pressure measurement',
                    'Hydrostatics',
                    'Fluid kinematics',
                    'Continuity equation',
                    "Bernoulli's equation",
                    'Fluid flow in pipes',
                    'Dimensional analysis and similitude',
                    'Hydraulic machines'
                ]
            },
            {
                code: 'GET207', title: 'Applied Mechanics', units: 3,
                topics: [
                    'Fundamental concepts of mechanics',
                    'Force systems',
                    'Moments and couples',
                    'Resultant forces',
                    'Equilibrium of particles',
                    'Equilibrium of rigid bodies',
                    'Friction',
                    'Centroids and centres of gravity',
                    'Kinematics and dynamics'
                ]
            },
            {
                code: 'GET209', title: 'Engineering Mathematics I', units: 3,
                topics: [
                    'Algebra and functions',
                    'Complex numbers',
                    'Matrices and determinants',
                    'Vectors',
                    'Differentiation & Applications of differentiation',
                    'Integration & Applications of integration',
                    'Differential equations'
                ]
            },
            {
                code: 'GET211', title: 'Computing and Software Engineering', units: 3,
                topics: [
                    'Introduction to computers and computing',
                    'Computer hardware and software',
                    'Number systems and data representation',
                    'Algorithms and flowcharts',
                    'Programming fundamentals (Variables, data types, operators)',
                    'Control structures (selection and loops)',
                    'Functions, arrays and data structures',
                    'Software engineering principles and development'
                ]
            },
            {
                code: 'OOU-EEE201', title: 'Electrical Laboratory and Installation I', units: 1,
                topics: [
                    'Electrical laboratory safety',
                    'Electrical measuring instruments',
                    'Measurement of voltage, current and resistance',
                    'Series and parallel circuit experiments',
                    "Verification of Ohm's Law and Kirchhoff's Laws",
                    'Capacitor charging and discharging',
                    'Basic electrical installation practices',
                    'Testing, fault finding and electrical protection'
                ]
            }
        ];

        function courseCardHtml({ code, title, units, topics }, index) {
            return `
                <div class="course-card" style="animation-delay: ${index * 0.04}s;">
                    <div class="course-header">
                        <h3>${code} — ${title} <span class="unit-badge">${units} ${units === 1 ? 'Unit' : 'Units'}</span></h3>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="course-content">
                        <div class="course-content-inner">
                            <ul>${topics.map((topic) => `<li>${topic}</li>`).join('')}</ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // Accordion: opening one course closes whichever was open before.
        function toggleCourse(card) {
            const wasOpen = card.classList.contains('active');

            document.querySelectorAll('.course-card.active').forEach((openCard) => {
                openCard.classList.remove('active');
                openCard.querySelector('.course-content').style.maxHeight = null;
            });

            if (!wasOpen) {
                const content = card.querySelector('.course-content');
                card.classList.add('active');
                content.style.maxHeight = content.scrollHeight + 'px';
            }
        }

        const courseList = document.getElementById('courseList');
        courseList.innerHTML = COURSES.map(courseCardHtml).join('');
        courseList.addEventListener('click', (event) => {
            const header = event.target.closest('.course-header');
            if (header) toggleCourse(header.parentElement);
        });
    </script>
</body>
</html>
