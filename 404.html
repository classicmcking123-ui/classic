<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive - Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff416c">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle at 20% 0%, #23232d 0%, #16161a 45%, #101012 100%);
            color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            text-align: center; max-width: 440px; background: linear-gradient(165deg, #202027, #1a1a1f);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; padding: 44px 34px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 28px;
            background: linear-gradient(to right, #ff4b2b, #ff416c); background-clip: text;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .code { font-size: 72px; font-weight: 900; line-height: 1; margin-bottom: 6px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c); background-clip: text;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h1 { font-size: 20px; margin-bottom: 12px; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-primary {
            background: linear-gradient(135deg, #ff4b2b, #ff416c); color: #fff; text-decoration: none;
            padding: 12px 24px; border-radius: 20px; font-size: 13px; font-weight: 700; transition: 0.2s;
            box-shadow: 0 4px 14px rgba(255,65,108,0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #ccc; text-decoration: none;
            padding: 12px 24px; border-radius: 20px; font-size: 13px; font-weight: 700; transition: 0.2s;
        }
        .btn-secondary:hover { border-color: #25D366; color: #25D366; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">StudyHive <i class="fab fa-hive"></i></div>
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
        <div class="actions">
            <a href="home.html" class="btn-primary"><i class="fas fa-home"></i> Back to Dashboard</a>
            <a href="login_page.htm" class="btn-secondary">Sign In</a>
        </div>
    </div>
</body>
</html>
