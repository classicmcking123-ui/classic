<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive - Notes & Tips</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff416c">
    <script src="js/register-sw.js"></script>
    <style>
        .container { flex: 1; padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .page-header h1 { color: #ff4b2b; }
        .light-mode .page-header h1 { color: #222; }

        .tab-bar { display: flex; gap: 20px; margin-bottom: 25px; border-bottom: 2px solid #333; }
        .tab-btn { background: transparent; color: #aaa; border: none; font-size: 15px; font-weight: bold; cursor: pointer; padding: 10px 15px; transition: 0.3s; position: relative; }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: #ff416c; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background-color: #ff416c; border-radius: 3px 3px 0 0; }
        .light-mode .tab-bar { border-bottom-color: #ddd; }
        .light-mode .tab-btn { color: #666; }
        .light-mode .tab-btn:hover { color: #222; }
        .light-mode .tab-btn.active { color: #ff416c; }

        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .note-card { background-color: #222; border: 1px solid #333; border-radius: 8px; padding: 25px; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; animation: cardIn 0.4s ease backwards; }
        .note-card:hover { transform: translateY(-5px); border-color: #ff4b2b; box-shadow: 0 5px 15px rgba(255, 75, 43, 0.1); }
        .note-card h3 { font-size: 18px; margin-bottom: 10px; }
        .note-card p { font-size: 13px; color: #aaa; margin-bottom: 25px; line-height: 1.5; }
        .note-tag { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .light-mode .note-card { background-color: #fff; border-color: #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .light-mode .note-card h3 { color: #222; }
        .light-mode .note-card p { color: #666; }

        .open-link-btn { background: #111; color: #fff; text-decoration: none; padding: 10px; border-radius: 5px; text-align: center; border: 1px solid #444; font-size: 13px; transition: 0.3s; }
        .open-link-btn:hover { background: #ff4b2b; border-color: #ff4b2b; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Shared Notes & Tips</h1>
                <p><i class="fas fa-link"></i> External resources and Google Notes curated by students.</p>
            </div>
            <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dash</a>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" id="tab-notes"><i class="fas fa-book"></i> Course Notes</button>
            <button class="tab-btn" id="tab-tips"><i class="fas fa-lightbulb"></i> Study Tips</button>
        </div>

        <div id="notesSection" class="notes-grid"></div>
        <div id="tipsSection" class="notes-grid" style="display: none;"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const NOTEBOOK_URL = 'https://notebooklm.google.com/notebook/';

        const COURSE_NOTES = [
            { tag: 'GET201', color: '#00c3ff', title: 'Applied Electricity I', summary: "Basic electrical quantities, circuit components, and Ohm's Law.", notebookId: '58d11d87-f782-45df-9ce1-6dd1af20c6ef' },
            { tag: 'ENT211', color: '#ffb300', title: 'Entrepreneurship & Innovation', summary: 'Theories of entrepreneurship, risk-taking, and enterprise formation steps.', notebookId: '38b1d54f-10d6-4c40-bb32-e532a0e10f69' },
            { tag: 'GET203', color: '#9c27b0', title: 'Engineering Graphics II', summary: 'Orthographic projection, isometric drawings, and 3D solid modelling.', notebookId: '19d88277-c70c-4653-b445-c4b1c7090f66' },
            { tag: 'GET205', color: '#2196f3', title: 'Fluid Mechanics', summary: "Fluid properties, Bernoulli's equation, and hydraulic machines.", notebookId: '3b8e6f94-6fb0-47a1-a150-5d8272a810d5' },
            { tag: 'GET207', color: '#ff9800', title: 'Applied Mechanics', summary: 'Force systems, moments, equilibrium of particles, and rigid bodies.', notebookId: 'cfeff938-29e6-43a5-be78-42f0b0b8902b' },
            { tag: 'GET209', color: '#f44336', title: 'Engineering Math I', summary: 'Complex numbers, matrices, differentiation, and integration.', notebookId: '094ffb73-9ee1-44d3-9ed8-a8637a782229' },
            { tag: 'GET211', color: '#4caf50', title: 'Software Engineering', summary: 'Algorithms, programming fundamentals, and software development.', notebookId: '920128bb-d4db-483b-bfa2-5d5b9dd553dc' },
            { tag: 'OOU-EEE201', color: '#009688', title: 'Lab & Installation I', summary: 'Laboratory safety, measuring instruments, and basic installation practices.', notebookId: '84002950-7454-4d11-8061-7de1819e0333' }
        ].map((note) => ({
            ...note,
            url: `${NOTEBOOK_URL}${note.notebookId}?utm_source=nlmm_share`,
            linkLabel: 'Open Google Notes'
        }));

        const STUDY_TIPS = [
            { tag: 'Study Tip', color: '#ff416c', title: 'Exam Prep Strategy', summary: 'How to balance lab reports and engineering mathematics effectively.', url: '#', linkLabel: 'Open Tip' }
        ];

        // `color` is a 6-digit hex; the tag background is the same color at ~10% opacity.
        function noteCardHtml({ tag, color, title, summary, url, linkLabel }, index) {
            const target = url === '#' ? '' : ' target="_blank"';
            return `
                <div class="note-card" style="animation-delay: ${index * 0.04}s;">
                    <div>
                        <span class="note-tag" style="color: ${color}; background: ${color}1a;">${tag}</span>
                        <h3>${title}</h3>
                        <p>${summary}</p>
                    </div>
                    <a href="${url}"${target} class="open-link-btn">
                        <i class="fas fa-external-link-alt"></i> ${linkLabel}
                    </a>
                </div>
            `;
        }

        document.getElementById('notesSection').innerHTML = COURSE_NOTES.map(noteCardHtml).join('');
        document.getElementById('tipsSection').innerHTML = STUDY_TIPS.map(noteCardHtml).join('');

        setupTabs({ 'tab-notes': 'notesSection', 'tab-tips': 'tipsSection' });
    </script>
</body>
</html>
